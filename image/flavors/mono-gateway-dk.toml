# VyOS for the Mono Gateway DK (NXP LS1046A) with the NXP ASK fast path.
#
# The kernel is ASK's 6.18 line: 6.18.63 + NXP SDK DPAA + the ASK series, built by
# ./build.sh kernel. Its .debs, the ASK packages and VyOS's kernel-tied
# packages rebuilt for it are placed in vyos-build's packages/ by image/build-iso.sh,
# where live-build pins them above the VyOS repository.

architecture = "arm64"
image_format = "iso"

kernel_version = "6.18.63"
kernel_revision = "1"
kernel_flavor = "vyos"

packages = [
  "ask-flowtable",
  "mono-gateway-bsp",
]

# The SoC's DUART is an 8250 (ttyS0), not the PL011 (ttyAMA) of arm64.toml.
[boot_settings]
  console_type = "ttyS"
  console_num = "0"
  console_speed = "115200"
