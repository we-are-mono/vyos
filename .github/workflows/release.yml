# The full build, with the ISO step native on arm64, and optionally the
# release. Start it from the Actions tab or with
#   gh workflow run release.yml [-f publish=true]
name: Build (and release)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  debs:
    name: Kernel and packages (x86-64, cross-compiled)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Kernel
        run: ./build.sh kernel

      - name: Packages
        run: ./build.sh packages

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          include-hidden-files: true
          retention-days: 7
          path: |
            build/debs/*.deb
            !build/debs/linux-headers-*
            !build/debs/linux-libc-dev_*
            build/debs/.kernel-key
            build/debs/.packages-key

  image:
    name: ISO and eMMC image (arm64, native)
    needs: debs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: build/debs

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ISO
        run: ./build.sh iso

      - name: eMMC image
        run: ./build.sh emmc

      - uses: actions/upload-artifact@v4
        with:
          name: images
          retention-days: 7
          compression-level: 0
          path: |
            build/images/*.iso
            build/images/*.img.gz
            build/images/*.sha256
            build/images/latest-iso
            build/images/latest-emmc

  publish:
    name: Release
    needs: image
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: images
          path: build/images

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso >/dev/null
          ./publish.sh
