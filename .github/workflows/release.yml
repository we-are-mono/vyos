# The full build, with the ISO step native on arm64, and optionally the
# release. Start it from the Actions tab or with
#   gh workflow run release.yml [-f publish=true]
name: Build (and release)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  debs:
    name: Kernel and packages (x86-64, cross-compiled)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      # The kernel takes 45-65 minutes here and most builds do not change
      # it: its outputs are cached, keyed on everything that defines it.
      # The cache holds what the packages step builds against: the kernel
      # .debs and signing key record, ASK's export and cdx modules, and the
      # kernel build tree without its object files (out-of-tree modules need
      # its headers, scripts, Module.symvers, vmlinux for BTF and the module
      # signing key, so they match the cached kernel).
      - name: Restore the kernel
        id: kernel
        uses: actions/cache/restore@v4
        with:
          key: kernel-${{ hashFiles('pins.sh', 'kernel/**', 'docker/Dockerfile.cross') }}
          path: |
            build/ask
            build/kernel/src
            build/kernel/ask-cdx
            build/debs/linux-*.deb
            build/debs/.kernel-key

      - name: Kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          ./build.sh kernel
          find build/kernel/src \( -name '*.o' -o -name '*.ko' -o -name '*.a' -o -name '*.mod.c' \) -delete
          rm -rf build/kernel/src/debian build/kernel/src/vmlinux.unstripped build/kernel/src/arch/arm64/boot/Image*

      - name: Save the kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.kernel.outputs.cache-primary-key }}
          path: |
            build/ask
            build/kernel/src
            build/kernel/ask-cdx
            build/debs/linux-*.deb
            build/debs/.kernel-key

      - name: Packages
        run: ./build.sh packages

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          include-hidden-files: true
          retention-days: 7
          path: |
            build/debs/*.deb
            !build/debs/linux-headers-*
            !build/debs/linux-libc-dev_*
            build/debs/.kernel-key
            build/debs/.packages-key

  image:
    name: ISO and eMMC image (arm64, native)
    needs: debs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: build/debs

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ISO
        run: ./build.sh iso

      - name: eMMC image
        run: ./build.sh emmc

      - uses: actions/upload-artifact@v4
        with:
          name: images
          retention-days: 7
          compression-level: 0
          path: |
            build/images/*.iso
            build/images/*.img.gz
            build/images/*.sha256
            build/images/latest-iso
            build/images/latest-emmc

  publish:
    name: Release
    needs: image
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: images
          path: build/images

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso >/dev/null
          ./publish.sh
